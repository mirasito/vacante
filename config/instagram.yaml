# Подборки вакансий в Instagram vacante (vacante/instagram.py): карусель «Работа в <город>» из вакансий,
# которые уже вышли в Telegram-канал города. Публикуются только города, чей канал работает.
#
# Часы — по времени Казахстана (UTC+5), подборка выходит примерно в :30 указанного часа.
# "*" — каждый час с 9 до 21. Порядок городов — приоритет, если упрёмся в лимит.
#
# Instagram API разрешает 50 публикаций за сутки на аккаунт (карусель — одна публикация),
# daily_limit чуть меньше. Сейчас по графику 48 в сутки, когда заработают каналы всех 18 городов. Город без своей строки публикуется в часы default.
daily_limit: 48
default: [12, 19]
cities:
  astana: [9, 11, 13, 15, 17, 19, 21]
  almaty: [9, 11, 13, 15, 17, 19, 21]
  shymkent: [10, 15, 20]
  karaganda: [10, 15, 20]
  aktobe: [12, 19]
  atyrau: [13, 20]
  aktau: [12, 19]
  pavlodar: [13, 20]
  ust-kamenogorsk: [12, 19]
  semey: [13, 20]
  kostanay: [12, 19]
  uralsk: [13, 20]
  petropavlovsk: [12, 19]
  taraz: [13, 20]
  kyzylorda: [12, 19]
  turkestan: [13, 20]
  kokshetau: [12, 19]
  taldykorgan: [13, 20]
