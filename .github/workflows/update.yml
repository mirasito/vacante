# Каждый час: собрать новые вакансии, сохранить их в ветку data и опубликовать сайт на GitHub Pages.
name: Обновление вакансий

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Подготовить ветку data
        run: |
          git config user.name "vacante-bot"
          git config user.email "vacante-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:refs/remotes/origin/data
            git worktree add data origin/data
            git -C data switch -C data
          else
            git worktree add --detach data
            git -C data switch --orphan data
          fi

      - name: Собрать вакансии
        run: python -m vacante collect --data-dir data

      - name: Сохранить данные
        run: |
          cd data
          git add vacancies.json state.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Вакансии на $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin data
          fi

      - name: Собрать сайт
        run: python -m vacante build --data-dir data --out public --base-url "${{ vars.SITE_URL || 'https://vacante.kz' }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
