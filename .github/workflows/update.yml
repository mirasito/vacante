# Каждый час: собрать новые вакансии (из каналов и от работодателей через бота), разослать
# подборки подписчикам бота, сохранить данные в ветку data и опубликовать сайт на GitHub Pages.
# После него post.yml публикует серию постов в свои каналы, а job instagram — подборки в Instagram
# (график в config/instagram.yaml; карточки выкладываются на сайт, Instagram забирает их по ссылке).
name: Обновление вакансий

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      geocode_limit:
        description: "Сколько запросов к карте сделать в этот прогон (пусто — как обычно, 60)"
        required: false
        default: ""
      geocode_check:
        description: "Проверить поиск адресов на N вакансиях hh.kz, где точку поставил hh (пусто — не проверять)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      instagram: ${{ steps.instagram.outputs.posts }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Подготовить ветку data
        run: |
          git config user.name "vacante-bot"
          git config user.email "vacante-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:refs/remotes/origin/data
            git worktree add data origin/data
            git -C data switch -C data
          else
            git worktree add --detach data
            git -C data switch --orphan data
          fi

      # Cloudflare нужен, чтобы забрать из базы бота вакансии, размещённые работодателями
      - name: Собрать вакансии
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Источник hh.kz (vacante/sources/hh.py) выключен, пока в Variables не задано HH_SOURCE_ENABLED=true
          HH_SOURCE_ENABLED: ${{ vars.HH_SOURCE_ENABLED || 'false' }}
          HH_TOKEN: ${{ secrets.HH_TOKEN }}
          # Или токен приложения по Client Id и Client Secret с dev.hh.ru (HH_TOKEN тогда не нужен)
          HH_CLIENT_ID: ${{ secrets.HH_CLIENT_ID }}
          HH_CLIENT_SECRET: ${{ secrets.HH_CLIENT_SECRET }}
          HH_USER_AGENT: ${{ vars.HH_USER_AGENT }}
          # Точки адресов вакансий по OpenStreetMap (vacante/geocode.py): запросов за прогон, 0 выключает.
          # Разово больше — поле geocode_limit при ручном запуске; запросы всё равно не чаще раза в секунду
          GEOCODE_LIMIT: ${{ inputs.geocode_limit || vars.GEOCODE_LIMIT || '60' }}
        run: python -m vacante collect --data-dir data

      # Разово, полем geocode_check при ручном запуске: насколько точны точки OpenStreetMap и запасные запросы
      # по сравнению с точками hh.kz. После сбора, чтобы запросы к Nominatim не шли одновременно
      - name: Проверить поиск адресов
        if: inputs.geocode_check != ''
        continue-on-error: true
        env:
          GEOCODE_CHECK: ${{ inputs.geocode_check }}
        run: python -m vacante geocheck --data-dir data --sample "$GEOCODE_CHECK"

      # Адрес сайта из настроек Pages: <owner>.github.io/<repo>, а после подключения домена сам домен
      - id: pages
        uses: actions/configure-pages@v5

      - name: Адрес сайта
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: |
          : "${SITE_URL:=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          # Pages отдаёт http://, пока для домена выпускается сертификат; ссылки сразу делаем https
          echo "SITE_URL=${SITE_URL/#http:/https:}" >> "$GITHUB_ENV"

      - name: Разослать подборки подписчикам бота
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m vacante digest --data-dir data --base-url "$SITE_URL"

      - name: Сохранить данные
        run: |
          cd data
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Вакансии на $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Параллельно post.yml мог сохранить posted.json: подтягиваем его коммит и пробуем снова
          for attempt in 1 2 3; do
            git push -q origin data && exit 0
            git pull -q --rebase origin data
          done
          exit 1

      - name: Собрать сайт
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}  # данные админки шифруются этим паролем
        run: python -m vacante build --data-dir data --out public --base-url "$SITE_URL"

      # Веб-версия приложения со свайпами (её собирает app.yml в ветку app-web) ложится рядом
      # с данными ленты в public/app/
      - name: Приложение в /app/
        run: |
          if git fetch -q origin app-web; then
            mkdir -p public/app
            git archive FETCH_HEAD | tar -x -C public/app
          else
            echo "::notice::Ветки app-web ещё нет, приложение не выкладываю"
          fi

      # Только когда есть секрет INSTAGRAM_TOKEN: карточки подборок городов, которым по графику пора
      - name: Карточки подборок в Instagram
        id: instagram
        env:
          HAS_INSTAGRAM: ${{ secrets.INSTAGRAM_TOKEN != '' }}
        run: |
          if [ "$HAS_INSTAGRAM" != "true" ]; then echo "posts=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          python -m vacante instagram plan --data-dir data --out public --base-url "$SITE_URL"
          echo "posts=$(python -c 'import json; print(len(json.load(open("public/ig/plan.json"))["posts"]))')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.instagram.outputs.posts != '0'
        with:
          name: instagram-plan
          path: public/ig/plan.json
          retention-days: 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Подборки в Instagram: после выкладки сайта, когда карточки уже доступны по ссылкам
  instagram:
    needs: [collect, deploy]
    if: needs.collect.outputs.instagram != '0' && needs.collect.outputs.instagram != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: instagram
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Подготовить ветку data
        run: |
          git config user.name "vacante-bot"
          git config user.email "vacante-bot@users.noreply.github.com"
          git fetch --depth 1 origin data:refs/remotes/origin/data
          git worktree add data origin/data
          git -C data switch -C data

      - uses: actions/download-artifact@v4
        with:
          name: instagram-plan
          path: plan

      - name: Опубликовать подборки
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python -m vacante instagram publish --data-dir data --plan plan/plan.json

      # instagram.json пишет только этот job, поэтому rebase на свежие вакансии проходит без конфликтов
      - name: Сохранить
        run: |
          [ -f data/instagram.json ] || exit 0
          git -C data add instagram.json
          git -C data diff --cached --quiet && exit 0
          git -C data commit -q -m "Instagram $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4; do
            git -C data push -q origin data && exit 0
            git -C data pull -q --rebase origin data || true
          done
          echo "::error::не удалось сохранить instagram.json"
          exit 1

  # Серию постов обычно запускает post.yml по событию workflow_run. Но если это обновление
  # запустил другой workflow (например, «Приложение» после сборки) токеном GITHUB_TOKEN,
  # GitHub такое событие не присылает, и посты в каналы пропускали целый час.
  # Тогда запускаем серию сами: workflow_dispatch от GITHUB_TOKEN GitHub разрешает.
  posts:
    needs: [collect, deploy]
    if: always() && needs.collect.result == 'success' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Запустить посты в каналы
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post.yml --ref main --repo "$GITHUB_REPOSITORY"
