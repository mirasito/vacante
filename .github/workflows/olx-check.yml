name: Проверить доступ к выдаче OLX
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Сервер"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  read-listing:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Проверить две страницы без публикации
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OLX_VIA: ${{ vars.OLX_VIA || 'https://api.vacante.kz' }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from vacante.sources.olx import make_client, via_server
          from vacante.sources.olx_web import collect_web
          state = {}
          assert via_server(), "Требуется настроенный сервер Vacante"
          with make_client() as client:
              collect_web(state, datetime.now(timezone.utc), client, None, max_pages=2, via=True)
          print(state)
          if state["olx_status"] != "ok":
              raise SystemExit(1)
          PY
