# Приложение со свайпами (app/, Expo + React Native). Один код для Telegram Mini App, Android и iOS.
# Веб-версию собираем в ветку app-web; update.yml кладёт её на сайт в /app/ при каждой выкладке,
# поэтому после сборки сразу запускаем обновление сайта. Сборки для сторов делает EAS (app/eas.json).
name: Приложение

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: app
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Проверка типов
        run: npx tsc --noEmit
      - name: Сборка веб-версии
        run: npx expo export -p web --output-dir dist

      - name: Выложить в ветку app-web
        if: github.event_name != 'pull_request'
        run: |
          cd dist
          git init -q -b app-web
          git config user.name "vacante-bot"
          git config user.email "vacante-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Приложение: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-web

      - name: Обновить сайт
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main --repo "$GITHUB_REPOSITORY"
