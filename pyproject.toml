[project]
name = "vacante"
version = "0.1.0"
description = "Агрегатор вакансий для синих воротничков в Казахстане"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["vacante*"]

[tool.setuptools.package-data]
"vacante" = ["fonts/*"]
"vacante.site" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
