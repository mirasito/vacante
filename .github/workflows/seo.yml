# Google Search Console: клики и показы в поиске Google по дням, запросы, страницы, устройства,
# и отправка карты сайта (vacante/searchping.py report). Запуск: Actions → «Поиск Google» → Run workflow.
# Вторым шагом выборочная проверка индекса (searchping.py inspect): сколько страниц каждого вида Google
# держит в индексе, где выбрал главной чужую страницу и когда заходил в последний раз.
#
# Нужен секрет GSC_SERVICE_ACCOUNT (один раз, ~10 минут). Он же включает отправку новых вакансий
# с разметкой JobPosting в Google (Indexing API) в каждом часовом обновлении. Записывает ли Google эти
# сообщения, показывает строка «Google Indexing API» в журнале обновления и шаг probe ниже.
# 1. https://console.cloud.google.com/projectcreate — создать проект «vacante».
# 2. Включить в нём два API:
#    https://console.cloud.google.com/apis/library/searchconsole.googleapis.com
#    https://console.cloud.google.com/apis/library/indexing.googleapis.com
# 3. https://console.cloud.google.com/iam-admin/serviceaccounts — «Создать сервисный аккаунт», имя vacante-seo,
#    роли не нужны. Открыть его → «Ключи» → «Добавить ключ» → JSON. Скачается файл.
# 4. https://search.google.com/search-console/users — «Добавить пользователя»: почта аккаунта
#    (vacante-seo@….iam.gserviceaccount.com), разрешение «Владелец» (без него Indexing API отвечает 403).
# 5. GitHub → Settings → Secrets and variables → Actions → New repository secret: GSC_SERVICE_ACCOUNT,
#    значение — всё содержимое скачанного JSON-файла.
name: Поиск Google

on:
  workflow_dispatch:
    inputs:
      days:
        description: "За сколько последних дней (0 — без сводки)"
        default: "28"
      inspect:
        description: "Проверить индекс на стольких страницах (0 — не проверять, не больше 600)"
        default: "120"
      probe:
        description: "Проверить Indexing API на двух вакансиях: сообщить Google и спросить, записал ли он"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Цифры
        if: inputs.days != '0'
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          set -o pipefail
          python -m vacante.searchping report "${{ inputs.days || '28' }}" | tee gsc.txt
          { echo '```'; cat gsc.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Индекс
        if: inputs.inspect != '0'
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          PAGES: ${{ inputs.inspect || '120' }}
        run: |
          set -o pipefail
          [[ $PAGES =~ ^[0-9]+$ ]] || { echo "::error::В поле inspect должно быть число"; exit 1; }
          python -m vacante.searchping inspect "$PAGES" | tee index.txt
          { echo '```'; cat index.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Часовое обновление видит только «200» на отправку. Здесь две вакансии (с разметкой JobPosting и без)
      # проходят весь путь: что Google знал о странице до сообщения, что ответил на сообщение и записал ли его.
      # Тратит два сообщения из 200 в сутки
      - name: Indexing API на двух вакансиях
        if: inputs.probe
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          set -o pipefail
          python -m vacante.searchping probe | tee probe.txt
          { echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
