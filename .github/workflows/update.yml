# Каждый час: собрать новые вакансии (из каналов и от работодателей через бота), разослать
# подборки подписчикам бота, сохранить данные в ветку data и опубликовать сайт на GitHub Pages.
# После него post.yml публикует серию постов в свои каналы.
name: Обновление вакансий

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Подготовить ветку data
        run: |
          git config user.name "vacante-bot"
          git config user.email "vacante-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:refs/remotes/origin/data
            git worktree add data origin/data
            git -C data switch -C data
          else
            git worktree add --detach data
            git -C data switch --orphan data
          fi

      # Cloudflare нужен, чтобы забрать из базы бота вакансии, размещённые работодателями
      - name: Собрать вакансии
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Источник hh.kz (vacante/sources/hh.py) выключен, пока в Variables не задано HH_SOURCE_ENABLED=true
          HH_SOURCE_ENABLED: ${{ vars.HH_SOURCE_ENABLED || 'false' }}
          HH_TOKEN: ${{ secrets.HH_TOKEN }}
          # Или токен приложения по Client Id и Client Secret с dev.hh.ru (HH_TOKEN тогда не нужен)
          HH_CLIENT_ID: ${{ secrets.HH_CLIENT_ID }}
          HH_CLIENT_SECRET: ${{ secrets.HH_CLIENT_SECRET }}
          HH_USER_AGENT: ${{ vars.HH_USER_AGENT }}
        run: python -m vacante collect --data-dir data

      # Адрес сайта из настроек Pages: <owner>.github.io/<repo>, а после подключения домена сам домен
      - id: pages
        uses: actions/configure-pages@v5

      - name: Адрес сайта
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: |
          : "${SITE_URL:=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          # Pages отдаёт http://, пока для домена выпускается сертификат; ссылки сразу делаем https
          echo "SITE_URL=${SITE_URL/#http:/https:}" >> "$GITHUB_ENV"

      - name: Разослать подборки подписчикам бота
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m vacante digest --data-dir data --base-url "$SITE_URL"

      - name: Сохранить данные
        run: |
          cd data
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Вакансии на $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Параллельно post.yml мог сохранить posted.json: подтягиваем его коммит и пробуем снова
          for attempt in 1 2 3; do
            git push -q origin data && exit 0
            git pull -q --rebase origin data
          done
          exit 1

      - name: Собрать сайт
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}  # данные админки шифруются этим паролем
        run: python -m vacante build --data-dir data --out public --base-url "$SITE_URL"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
