<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Шаблон страницы веб-версии (npx expo customize public/index.html): у шаблона Expo нет описания,
         канонического адреса и превью ссылки, поэтому поисковик и мессенджеры видели одно «You need to enable JavaScript» -->
    <meta name="description" content="Вакансии Казахстана свайпами: кафе, магазины, склады, доставка. Откликайтесь с профилем и видеокружком, без резюме." />
    <link rel="canonical" href="https://vacante.kz/app/" />
    <meta property="og:site_name" content="vacante.kz" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vacante.kz/app/" />
    <meta property="og:title" content="Vacante — вакансии свайпами" />
    <meta property="og:description" content="Вакансии Казахстана свайпами: кафе, магазины, склады, доставка." />
    <meta property="og:image" content="https://vacante.kz/static/icon-512.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      <p style="font: 17px/1.5 system-ui, sans-serif; padding: 24px">
        Приложение Vacante работает с включённым JavaScript. Все вакансии без него — на
        <a href="https://vacante.kz/">vacante.kz</a>.
      </p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
