# Сервер Vacante в Казахстане (server/): профили соискателей, отклики, напоминания.
# На каждый PR проверяет типы, тесты и скрипты, а после push в main выкладывает сервер,
# если есть секрет SERVER_HOST (IP сервера) и способ первого входа:
# - SERVER_PASSWORD: пароль root из письма хостинга;
# - или SERVER_SSH_KEY (закрытый ключ пользователя ubuntu, как в Yandex Cloud; другой пользователь —
#   переменная SERVER_USER) и SERVER_SECRET (длинная случайная строка, из неё выводятся ключи).
# Первая выкладка кладёт ключ выкладки и выключает вход по паролю, а ключ из SERVER_SSH_KEY убирает
# с сервера. Дальше вход только по ключу выкладки; он каждый раз выводится из того же секрета
# (server/deploy/keys.py), поэтому секрет после первой выкладки не меняют.
# Сервер из WIPE_ONCE перед первой установкой стирается до системы (server/deploy/wipe.sh).
name: Сервер

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: Типы
        run: npm run typecheck
      - name: Тесты
        run: npm test
      - name: Скрипты установки
        run: |
          bash -n deploy/*.sh
          shellcheck deploy/*.sh
          python3 -m py_compile deploy/keys.py deploy/first_key.py

  deploy:
    needs: test
    # Выкладываем только main, даже если workflow запустили вручную с другой ветки
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
      SERVER_USER: ${{ vars.SERVER_USER || 'ubuntu' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      KEYS: ${{ github.workspace }}/.keys
      # Сервер, который раньше работал под другой проект: перед первой установкой его стирают
      WIPE_ONCE: "94.131.93.0"
    steps:
      - name: Проверить секреты
        id: secrets
        run: |
          if [ -n "$SERVER_SSH_KEY" ] && [ -z "$SERVER_SECRET" ]; then
            echo "::error::Для первого входа по ключу нужен ещё секрет SERVER_SECRET: длинная случайная строка, из неё выводятся ключи выкладки и резервных копий"
            exit 1
          fi
          if [ -n "$SERVER_HOST" ] && { [ -n "$SERVER_PASSWORD" ] || [ -n "$SERVER_SSH_KEY" ]; } && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Нет секретов SERVER_HOST и SERVER_PASSWORD (или SERVER_SSH_KEY), выкладку сервера пропускаю"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready
        with:
          python-version: "3.12"

      - name: Ключи выкладки
        if: steps.secrets.outputs.ready
        run: |
          if [[ ! $SERVER_HOST =~ ^[A-Za-z0-9.:-]+$ ]]; then
            echo "::error::В секрете SERVER_HOST должен быть только IP-адрес сервера, например 185.22.67.10"
            exit 1
          fi
          if [[ ! $SERVER_USER =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::В переменной SERVER_USER должно быть имя пользователя, например ubuntu"
            exit 1
          fi
          pip install --quiet "cryptography>=42"
          backup_key=$(python server/deploy/keys.py "$KEYS" "$SERVER_HOST")
          echo "::add-mask::$backup_key"
          echo "BACKUP_KEY=$backup_key" >> "$GITHUB_ENV"
          # Вход на сервер для следующих шагов: только по ключу и только к серверу с известным ключом
          cat > "$KEYS/ssh" <<EOF
          #!/usr/bin/env bash
          exec ssh -i "$KEYS/deploy_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o UserKnownHostsFile="$KEYS/known_hosts" -o StrictHostKeyChecking=yes \
            "root@$SERVER_HOST" "\$@"
          EOF
          chmod 700 "$KEYS/ssh"
          if [ -n "$SERVER_SSH_KEY" ]; then
            # Ключ часто портится при копировании (переводы строк Windows, пробелы вместо переводов
            # строк): first_key.py собирает его заново из текста между -----BEGIN и -----END
            python3 server/deploy/first_key.py "$KEYS/first_key"
            if ! ssh-keygen -y -P '' -f "$KEYS/first_key" > "$KEYS/first_key.pub"; then
              echo "::error::В секрете SERVER_SSH_KEY не закрытый ключ SSH без пароля. Нужен весь ключ, от -----BEGIN до -----END"
              exit 1
            fi
          fi

      - name: Доступ к серверу
        if: steps.secrets.outputs.ready
        run: |
          if "$KEYS/ssh" true 2>/dev/null; then
            echo "Вход по ключу работает"
            exit 0
          fi
          first=(-o UserKnownHostsFile="$KEYS/known_hosts.first" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          with_key=(-i "$KEYS/deploy_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes "${first[@]}")
          # Ключ выкладки, ключ сервера и настройки SSH ставит server/deploy/ssh-setup.sh
          tar -C "$KEYS" -cf "$KEYS/setup.tar" deploy_ed25519.pub host_ed25519 host_ed25519.pub \
            -C "$GITHUB_WORKSPACE/server/deploy" 01-vacante.conf ssh-setup.sh
          # shellcheck disable=SC2016 # переменные раскрываются на сервере
          setup='d=$(mktemp -d) && tar -xf - -C "$d" && $SUDO bash "$d/ssh-setup.sh" "$d"; s=$?; rm -rf "$d"; exit $s'
          if [ -n "$SERVER_SSH_KEY" ]; then
            echo "Первый вход: по ключу из SERVER_SSH_KEY как $SERVER_USER ставлю ключ выкладки для root"
            boot=(-i "$KEYS/first_key" -o IdentitiesOnly=yes -o BatchMode=yes "${first[@]}")
            if ! ssh "${boot[@]}" "$SERVER_USER@$SERVER_HOST" "SUDO='sudo -n'; $setup" < "$KEYS/setup.tar"; then
              echo "::error::Не получилось войти как $SERVER_USER по ключу из SERVER_SSH_KEY или выполнить sudo. Проверьте SERVER_HOST и SERVER_SSH_KEY"
              exit 1
            fi
          else
            echo "Первый вход: по паролю кладу ключ выкладки, потом выключаю вход по паролю"
            sudo apt-get update -q >/dev/null
            sudo apt-get install -y -q sshpass >/dev/null
            export SSHPASS="$SERVER_PASSWORD"
            password_only=(-o PubkeyAuthentication=no -o "PreferredAuthentications=password,keyboard-interactive")
            if ! sshpass -e ssh "${first[@]}" "${password_only[@]}" "root@$SERVER_HOST" \
                'umask 077; mkdir -p /root/.ssh; key=$(cat); touch /root/.ssh/authorized_keys; grep -qxF "$key" /root/.ssh/authorized_keys || printf "%s\n" "$key" >> /root/.ssh/authorized_keys' \
                < "$KEYS/deploy_ed25519.pub"; then
              echo "::error::Не получилось войти на сервер как root по паролю. Проверьте секреты SERVER_HOST и SERVER_PASSWORD (пароль root из письма хостинга)"
              exit 1
            fi
            # Ключ должен работать до того, как выключим пароли, иначе можно потерять доступ
            if ! ssh "${with_key[@]}" "root@$SERVER_HOST" true; then
              echo "::error::Ключ выкладки положен, но вход по нему не работает. Вход по паролю не трогал"
              exit 1
            fi
            ssh "${with_key[@]}" "root@$SERVER_HOST" "SUDO=; $setup" < "$KEYS/setup.tar"
          fi
          sleep 3
          if ! "$KEYS/ssh" true; then
            echo "::error::Настройки SSH поставлены, но root не входит по ключу выкладки. Ключ из SERVER_SSH_KEY не трогал"
            exit 1
          fi
          if [ -z "$SERVER_SSH_KEY" ] && sshpass -e ssh -o UserKnownHostsFile="$KEYS/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "${password_only[@]}" "root@$SERVER_HOST" true 2>/dev/null; then
            echo "::warning::Вход по паролю всё ещё работает: настройки хостинга перекрывают наши. Напишите Claude в тред"
          fi
          echo "Готово: вход только по ключу выкладки, ключ сервера закреплён"

      - name: Убрать ключ первого входа
        if: steps.secrets.outputs.ready && env.SERVER_SSH_KEY != ''
        run: |
          # Ключ из SERVER_SSH_KEY выкладке больше не нужен и мог засветиться: убираем его у всех
          # пользователей сервера. Каждый раз, пока секрет есть: шаг ничего не ломает, если ключа уже нет
          awk '{ print $1 " " $2 }' "$KEYS/first_key.pub" | "$KEYS/ssh" 'key=$(cat)
            for f in /root/.ssh/authorized_keys /home/*/.ssh/authorized_keys; do
              [ -f "$f" ] || continue
              grep -vF "$key" "$f" > "$f.new" || true
              cat "$f.new" > "$f"
              rm -f "$f.new"
            done'
          echo "Ключа из SERVER_SSH_KEY на сервере нет, секрет SERVER_SSH_KEY можно удалить"

      - name: Очистка сервера (один раз)
        if: steps.secrets.outputs.ready && env.SERVER_HOST == env.WIPE_ONCE
        run: |
          # Сервер из WIPE_ONCE раньше работал под другой проект: до первой установки Vacante стираем
          # на нём всё, кроме системы (server/deploy/wipe.sh), обновляем систему и перезагружаем.
          # Когда Vacante уже стоит, шаг ничего не делает
          if "$KEYS/ssh" test -e /etc/vacante; then
            echo "Vacante уже установлен, очистка не нужна"
            exit 0
          fi
          read -r type key _ < "$KEYS/deploy_ed25519.pub"
          "$KEYS/ssh" 'umask 077; cat > /run/vacante-wipe.sh' < server/deploy/wipe.sh
          # Очистка идёт отдельной службой: если связь оборвётся или при обновлении перезапустится SSH,
          # она всё равно дойдёт до конца. Итог и код выхода складывает в /run
          "$KEYS/ssh" "rm -f /run/vacante-wipe.out /run/vacante-wipe.rc; systemctl reset-failed vacante-wipe 2>/dev/null; \
            systemd-run --unit=vacante-wipe --quiet sh -c 'bash /run/vacante-wipe.sh $SERVER_USER $type $key > /run/vacante-wipe.out 2>&1; echo \$? > /run/vacante-wipe.rc'"
          echo "Очистка идёт, обычно 5–15 минут"
          rc=
          for _ in $(seq 180); do
            sleep 10
            rc=$("$KEYS/ssh" 'cat /run/vacante-wipe.rc 2>/dev/null' || true)
            [ -z "$rc" ] || break
          done
          "$KEYS/ssh" 'cat /run/vacante-wipe.out' || true
          if [ "$rc" != 0 ]; then
            echo "::error::Очистка не закончилась${rc:+ (код $rc)}, дальше сервер не трогаю. Напишите Claude в тред"
            exit 1
          fi
          boot=$("$KEYS/ssh" cat /proc/sys/kernel/random/boot_id)
          "$KEYS/ssh" 'systemd-run --on-active=5 --quiet systemctl reboot'
          echo "Перезагружаю сервер после обновления системы"
          for _ in $(seq 60); do
            sleep 10
            now=$("$KEYS/ssh" cat /proc/sys/kernel/random/boot_id 2>/dev/null || true)
            if [ -n "$now" ] && [ "$now" != "$boot" ]; then
              echo "Сервер перезагрузился"
              exit 0
            fi
          done
          echo "::error::Сервер не вернулся после перезагрузки за 10 минут. Посмотрите ВМ в консоли Yandex Cloud"
          exit 1

      - name: Установка и обновление системы
        if: steps.secrets.outputs.ready
        run: |
          tar -C server/deploy -czf - . | "$KEYS/ssh" \
            'rm -rf /root/vacante-deploy && mkdir -p /root/vacante-deploy && tar -xzf - -C /root/vacante-deploy && bash /root/vacante-deploy/install.sh'

      - name: Секреты на сервере
        if: steps.secrets.outputs.ready
        run: |
          printf 'TELEGRAM_BOT_TOKEN=%s\nBACKUP_KEY=%s\n' "$TELEGRAM_BOT_TOKEN" "$BACKUP_KEY" \
            | "$KEYS/ssh" 'umask 077; cat > /etc/vacante/env.new && mv /etc/vacante/env.new /etc/vacante/env'

      - name: Выкладка
        if: steps.secrets.outputs.ready
        run: |
          tar -czf - server/package.json server/src server/migrations config/telegram_channels.yaml \
            | "$KEYS/ssh" "cat > /root/vacante-release.tgz && bash /root/vacante-deploy/release.sh $GITHUB_SHA /root/vacante-release.tgz"

      - name: Проверка HTTPS
        if: steps.secrets.outputs.ready
        run: |
          for host in api.vacante.kz p.vacante.kz; do
            ip=$(getent ahostsv4 "$host" | awk 'NR == 1 { print $1 }' || true)
            if [ "$ip" != "$SERVER_HOST" ]; then
              echo "::warning::Запись DNS для $host ещё не указывает на сервер. Добавьте в PS.kz запись A: ${host%%.*} → IP сервера"
              continue
            fi
            if curl -fsS --max-time 20 --retry 6 --retry-delay 10 --retry-all-errors "https://$host/health"; then
              echo " ← https://$host работает"
            else
              echo "::warning::https://$host пока не отвечает: сертификат выпускается в первые минуты после появления записи DNS. Запустите workflow ещё раз через 10 минут"
            fi
          done

      - name: Убрать ключи
        if: always()
        run: rm -rf "$KEYS"
