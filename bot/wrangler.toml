# Бот @vacantekz_bot (подписки соискателей и вакансии от работодателей) на Cloudflare Workers (бесплатный тариф).
# Выкладывается workflow .github/workflows/bot.yml; database_id он подставляет сам.
name = "vacante-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false  # отдельные адреса для каждой версии боту не нужны

[vars]
SITE_URL = "https://vacante.kz"
GITHUB_REPO = "mirasito/vacante"
# Сервер в Казахстане с профилями соискателей (server/): бот передаёт ему номер из приложения
SERVER_URL = "https://api.vacante.kz"
# Каналы vacante: их админы становятся модераторами вакансий командой /admin (бот там тоже админ)
CHANNELS = "@vacanteastana,@vacantealmaty"
# Тарифы (2026-11-18, src/employer.js). Включаются секретом KASPI_DETAILS (номер Kaspi и имя получателя),
# без него размещение бесплатное и платных кнопок нет. Модераторы (админы каналов) размещают бесплатно всегда.
# Базовый: платное размещение вакансии или смены, на проверку уходит после оплаты. "0" делает его бесплатным.
POST_PRICE = "990"
# Про (бывшее «🔥 Срочно»): первой в списке города с пометкой, закреп и повторный пост в канале, итог по откликам.
# Можно выбрать сразу при размещении (одна оплата за всё) или поднять опубликованную вакансию.
BOOST_PRICE = "3990"
BOOST_DAYS = "14"
# Про для смены на день (/smena): действует до дня смены
SHIFT_BOOST_PRICE = "1390"
# Пакеты Про: «сколько вакансий:цена:сколько дней действует», через запятую
PACKS = "3:9990:60,10:29990:90"

# Запасной будильник часового обновления сайта (src/cron.js). Расписание update.yml
# стоит на 17-ю минуту, будильник проверяет в 25-ю и запускает, только если GitHub проспал.
[triggers]
crons = ["25 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "vacante-bot"
database_id = "DATABASE_ID"
migrations_dir = "migrations"
