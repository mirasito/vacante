# Vacante: на сервер входят только по ключу (ключ выкладки из GitHub Actions), без паролей.
# Файл называется 01-…, чтобы стоять раньше настроек хостинга: у sshd побеждает первое значение.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
HostKey /etc/ssh/ssh_host_ed25519_key
