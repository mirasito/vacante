name: Импорт облачной выдачи OLX
on:
  workflow_dispatch:
  push:
    branches: [main, olx-cloud-inbox]
    paths:
      - olx-inbox.sealed
      - vacante/sources/olx_cloud.py
      - .github/workflows/olx-check.yml
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Show receiver public key
        if: github.ref_name == 'main'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m vacante.sources.olx_cloud public-key
      - uses: actions/checkout@v4
        if: github.ref_name == 'olx-cloud-inbox'
        with:
          ref: ${{ github.sha }}
          path: incoming
          sparse-checkout: olx-inbox.sealed
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Import encrypted jobs
        if: github.ref_name == 'olx-cloud-inbox'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OLX_VIA: ${{ vars.OLX_VIA || 'https://api.vacante.kz' }}
        run: python -m vacante.sources.olx_cloud deliver --file incoming/olx-inbox.sealed
